      - ./services/maintenance:/usr/src/app/services/maintenance
      - /usr/src/app/shared/node_modules
      - /usr/src/app/services/maintenance/node_modules
      - /usr/src/app/services/maintenance/prisma/.prisma
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
      - ./services/maintenance/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MAINTENANCE_PORT: ${MAINTENANCE_PORT:-3005}
      DEVICE_SERVICE_URL: ${DEVICE_SERVICE_URL:-http://device:3003}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-internal-dev-key}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-tttn_c18_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-tttn_c18_2026_refresh}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

  ai:
