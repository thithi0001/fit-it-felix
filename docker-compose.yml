      - ./services/ai/.env:/usr/src/app/services/ai/.env:ro
      - ./shared:/usr/src/app/shared
      - ./services/ai:/usr/src/app/services/ai
      - /usr/src/app/shared/node_modules
      - /usr/src/app/services/ai/node_modules
