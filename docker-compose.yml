services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./.env:/usr/src/app/.env:ro
      - ./services/auth/.env:/usr/src/app/services/auth/.env:ro
      - ./shared:/usr/src/app/shared
      - ./services/auth:/usr/src/app/services/auth
      - /usr/src/app/shared/node_modules
      - /usr/src/app/services/auth/node_modules
      - /usr/src/app/services/auth/prisma/.prisma
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
      - ./services/auth/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      AUTH_PORT: ${AUTH_PORT:-3001}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-tttn_c18_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-tttn_c18_2026_refresh}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./.env:/usr/src/app/.env:ro
      - ./gateway/.env:/usr/src/app/gateway/.env:ro
      - ./shared:/usr/src/app/shared
      - ./gateway:/usr/src/app/gateway
      - /usr/src/app/shared/node_modules
      - /usr/src/app/gateway/node_modules
    depends_on:
      auth:
        condition: service_started
      user:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
      - ./gateway/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:3001}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user:3002}
      DEVICE_SERVICE_URL: ${DEVICE_SERVICE_URL:-http://device:3003}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory:3004}
      MAINTENANCE_SERVICE_URL: ${MAINTENANCE_SERVICE_URL:-http://maintenance:3005}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:3006}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL:-http://audit:3007}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification:3009}
      JWT_SECRET: ${JWT_SECRET:-tttn_c18_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-tttn_c18_2026_refresh}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: user
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./.env:/usr/src/app/.env:ro
      - ./services/user/.env:/usr/src/app/services/user/.env:ro
      - ./shared:/usr/src/app/shared
      - ./services/user:/usr/src/app/services/user
      - /usr/src/app/shared/node_modules
      - /usr/src/app/services/user/node_modules
      - /usr/src/app/services/user/prisma/.prisma
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
      - ./services/user/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      USER_PORT: ${USER_PORT:-3002}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-tttn_c18_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-tttn_c18_2026_refresh}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

  device:
    build:
      context: .
      dockerfile: services/device/Dockerfile
    container_name: device
    restart: unless-stopped
    ports:
      - "3003:3003"
    volumes:
      - ./.env:/usr/src/app/.env:ro
      - ./services/device/.env:/usr/src/app/services/device/.env:ro
      - ./shared:/usr/src/app/shared
      - ./services/device:/usr/src/app/services/device
      - /usr/src/app/shared/node_modules
      - /usr/src/app/services/device/node_modules
      - /usr/src/app/services/device/prisma/.prisma
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
      - ./services/device/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DEVICE_PORT: ${DEVICE_PORT:-3003}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-internal-dev-key}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-tttn_c18_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-tttn_c18_2026_refresh}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    container_name: inventory
    restart: unless-stopped
    ports:
      - "3004:3004"
    volumes:
      - ./.env:/usr/src/app/.env:ro
      - ./services/inventory/.env:/usr/src/app/services/inventory/.env:ro
      - ./shared:/usr/src/app/shared
      - ./services/inventory:/usr/src/app/services/inventory
      - /usr/src/app/shared/node_modules
      - /usr/src/app/services/inventory/node_modules
      - /usr/src/app/services/inventory/prisma/.prisma
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
      - ./services/inventory/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      INVENTORY_PORT: ${INVENTORY_PORT:-3004}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-tttn_c18_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-tttn_c18_2026_refresh}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

  maintenance:
